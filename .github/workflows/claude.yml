name: Claude Code

# 이슈·댓글에서 @claude를 부르면 Claude가 구현해서 claude/issue-<번호>-<시각> 브랜치에 커밋·push하고,
# 이슈에 PR 만들기 링크를 남긴다. PR 리뷰 댓글에서 부르면 그 PR 브랜치에 이어서 작업한다.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # public 저장소라서 저장소 소유자·멤버·협력자가 부를 때만 실행한다 (남이 토큰을 쓰지 못하게)
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # PR의 CI 결과를 읽기 위해 필요
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 구현 후 타입 체크·테스트·빌드를 돌릴 수 있도록 의존성을 미리 설치한다
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          additional_permissions: |
            actions: read

          claude_args: |
            --allowed-tools "Bash(npx tsc --noEmit -p .),Bash(npx vitest run *),Bash(npm run lint),Bash(npm run build),Bash(npm ci)"
            --append-system-prompt "GitHub Actions에서 실행 중이다. 이슈·댓글 답변과 커밋 메시지는 한국어로 쓴다. claude-output.md 대화 기록은 로컬 전용이므로 만들거나 고치지 않는다. 브랜치는 이 액션이 만든 claude/issue-... 브랜치를 그대로 쓰고 master에 직접 push하지 않는다. 커밋하기 전에 npx tsc --noEmit -p . , npm run lint , npx vitest run , npm run build 를 돌려 모두 통과시킨다. 그 밖의 규칙(아키텍처, 테스트 위치, MUI 9 API, 한국 시장 색 등)은 CLAUDE.md를 따른다."
