name: CI

# master push와 모든 PR에서 타입 체크·ESLint·테스트·프로덕션 빌드를 돌린다.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 같은 브랜치에 새로 push하면 이전 실행은 취소한다
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit -p .

      # Vite는 빌드 중에 ESLint를 돌리지 않아서 따로 검사한다 (경고도 실패: --max-warnings 0)
      - name: Lint
        run: npm run lint

      - name: Test
        run: npx vitest run

      # .env.production(공개 API 주소만)이 커밋돼 있어 별도 환경변수는 필요 없다.
      - name: Build
        run: npm run build
