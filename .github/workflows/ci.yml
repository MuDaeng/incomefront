name: CI

# master push와 모든 PR에서 타입 체크·테스트·프로덕션 빌드(ESLint 포함)를 돌린다.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 같은 브랜치에 새로 push하면 이전 실행은 취소한다
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # .npmrc의 legacy-peer-deps가 적용된다 (TypeScript 5.9 vs react-scripts의 ^4 peer 범위)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit -p .

      - name: Test
        run: npm test -- --watchAll=false

      # GitHub Actions는 CI=true라서 CRA가 ESLint 경고도 빌드 실패로 처리한다.
      # .env.production(공개 API 주소만)이 커밋돼 있어 별도 환경변수는 필요 없다.
      - name: Build
        run: npm run build
